<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tribal Wars - TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // GitHub Pages SPA redirect handler
      // Check if we were redirected from 404.html with a path parameter
      (function() {
        var params = new URLSearchParams(window.location.search);
        var path = params.get('p');
        if (path) {
          // Remove the query parameter and use history.replaceState to navigate
          var newUrl = window.location.pathname + path + window.location.hash;
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
